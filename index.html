<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melvin's Secret Challenge</title>
<style>
:root{--bg:#07070b;--panel:#12121a;--panel2:#191923;--text:#f7f7fb;--muted:#9292a3;--accent:#8b5cf6;--accent2:#ec4899;--good:#34d399}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,Arial,sans-serif;color:var(--text);
background:radial-gradient(circle at 20% 10%,#24104b 0,transparent 30%),radial-gradient(circle at 80% 90%,#42102f 0,transparent 30%),var(--bg);
display:flex;align-items:center;justify-content:center;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff04 1px,transparent 1px),linear-gradient(90deg,#ffffff04 1px,transparent 1px);background-size:35px 35px}
.wrap{width:min(980px,94vw);position:relative}
.panel{background:linear-gradient(145deg,#151520eF,#0e0e15eF);border:1px solid #ffffff12;border-radius:30px;padding:34px;box-shadow:0 30px 100px #000b;backdrop-filter:blur(15px)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:15px}
.badge{padding:8px 12px;border:1px solid #ffffff16;border-radius:999px;background:#ffffff08}
h1{font-size:clamp(34px,6vw,64px);line-height:1;margin:8px 0 16px;letter-spacing:-2px}
h2{font-size:32px;margin:5px 0 10px}
p{color:var(--muted);font-size:17px;line-height:1.6}
button{border:0;color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));padding:14px 24px;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 12px 30px #8b5cf633;transition:.15s}
button:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 35px #ec489955}
button.secondary{background:#ffffff0d;box-shadow:none;border:1px solid #ffffff16}
.hidden{display:none!important}
.progress{height:8px;background:#ffffff0b;border-radius:99px;overflow:hidden;margin:25px 0 30px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.5s}
.center{text-align:center}
.stat{display:inline-flex;gap:8px;padding:8px 13px;border-radius:999px;background:#ffffff08;color:#bbb;margin:5px}
.grid{display:grid;grid-template-columns:repeat(4,78px);gap:12px;justify-content:center;margin:30px auto}
.mem{width:78px;height:78px;padding:0;background:#ffffff09;border:1px solid #ffffff12;box-shadow:none;font-size:0}
.mem.open{font-size:30px;background:#ffffff16}
.targets{position:relative;height:330px;background:#08080d;border:1px solid #ffffff0d;border-radius:22px;margin:25px 0;overflow:hidden}
.target{position:absolute;width:46px;height:46px;padding:0;border-radius:50%;background:#fff;box-shadow:0 0 25px #fff8}
.word{font-size:45px;font-weight:900;letter-spacing:8px;margin:45px 0}
.choice{display:flex;justify-content:center;flex-wrap:wrap}
.secret-grid{grid-template-columns:repeat(4,80px)}
.secret-grid button{height:65px;padding:0;background:#ffffff09;box-shadow:none;border:1px solid #ffffff10}
#clicks{font-size:52px}
.final{padding:50px 10px}
.small{font-size:13px;color:#777}
#scare{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
.scareFace{font-size:min(42vw,390px);filter:drop-shadow(0 0 35px #f00);animation:terror .055s infinite}
.scareText{position:absolute;bottom:8%;font-size:clamp(24px,5vw,58px);font-weight:1000;letter-spacing:7px;text-shadow:0 0 20px #f00;animation:flicker .08s infinite}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#fff0 0 5px,#fff1 6px 7px);mix-blend-mode:screen;pointer-events:none}
@keyframes terror{0%{transform:translate(0) rotate(0) scale(1)}25%{transform:translate(18px,-12px) rotate(-2deg) scale(1.05)}50%{transform:translate(-20px,16px) rotate(2deg) scale(.96)}75%{transform:translate(12px,12px) rotate(-1deg) scale(1.08)}100%{transform:translate(-14px,-15px) rotate(1deg) scale(1)}}
@keyframes flicker{0%,100%{opacity:1}45%{opacity:.2}50%{opacity:1}75%{opacity:.35}}
.shake{animation:pageShake .08s 7}
@keyframes pageShake{0%{transform:translate(0)}25%{transform:translate(8px,-4px)}50%{transform:translate(-7px,5px)}75%{transform:translate(5px,4px)}100%{transform:translate(-4px,-5px)}}
@media(max-width:600px){.panel{padding:22px}.grid{grid-template-columns:repeat(4,60px)}.mem{width:60px;height:60px}.secret-grid{grid-template-columns:repeat(3,70px)}}
</style>
</head>
<body>
<div class="wrap" id="page">
<div class="panel">
<div class="top"><span>🔒 PRIVATE CHALLENGE</span><span class="badge" id="step">START</span></div>

<section id="intro" class="center">
<h1>Melvin's<br>Secret Challenge</h1>
<p>Eine kleine Sammlung von Aufgaben.<br>Schaffst du es bis zum Ende?</p>
<div class="stat">🎮 5 Aufgaben</div><div class="stat">🏆 1 Belohnung</div><br><br>
<button onclick="start()">CHALLENGE STARTEN →</button>
<p class="small">Tipp: Es wird nichts gespeichert.</p>
</section>

<section id="game" class="hidden">
<div id="title" class="center"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="content"></div>
</section>

<section id="finish" class="hidden center final">
<div style="font-size:70px">🏆</div>
<h1>Du hast es geschafft.</h1>
<p>Alle Aufgaben sind erledigt.<br>Deine geheime Belohnung wartet.</p>
<button onclick="finalStep()">🎁 BELOHNUNG ÖFFNEN</button>
</section>
</div>
</div>

<div id="scare" class="hidden">
<div class="flash" id="flash"></div>
<div class="scan"></div>
<div class="scareFace">😱</div>
<div class="scareText">DU HAST ES GESCHAFFT.</div>
</div>

<audio id="music" src="never-gonna-meow-you-up.mp3"></audio>

<script>
let level=0,opened=[],matched=0,clicks=0;

const title=document.getElementById("title"),content=document.getElementById("content"),bar=document.getElementById("bar");
const page=document.getElementById("page"), step=document.getElementById("step");

function start(){intro.classList.add("hidden");game.classList.remove("hidden");showLevel()}
function showLevel(){
 level++; clicks=0; opened=[]; matched=0;
 bar.style.width=((level-1)*20)+"%"; step.textContent="AUFGABE "+level+" / 5";

 if(level===1){
  title.innerHTML="<h2>🎯 Präzisionstest</h2><p>Klicke alle 6 leuchtenden Ziele an.</p>";
  let h='<div class="targets" id="targets">';
  for(let i=0;i<6;i++){let x=5+Math.random()*88,y=5+Math.random()*82;h+=`<button class="target" style="left:${x}%;top:${y}%" onclick="hit(this)"></button>`}
  content.innerHTML=h+"</div><div class='center'><span class='stat' id='hits'>Treffer: 0 / 6</span></div>";
 }else if(level===2){
  title.innerHTML="<h2>🧠 Memory</h2><p>Finde alle 4 Paare.</p>";
  let a=["🐱","🐱","💜","💜","⭐","⭐","🎮","🎮"];a.sort(()=>Math.random()-.5);
  content.innerHTML='<div class="grid">'+a.map(e=>`<button class="mem" data-v="${e}" onclick="memory(this)">${e}</button>`).join("")+"</div>";
 }else if(level===3){
  title.innerHTML="<h2>🔤 Das geheime Wort</h2><p>Ordne die Buchstaben und wähle die richtige Antwort.</p>";
  content.innerHTML="<div class='word'>M E L V I N</div><div class='choice'><button onclick='answerWord(true)'>MELVIN</button><button class='secondary' onclick='answerWord(false)'>MAXIMILIAN</button></div>";
 }else if(level===4){
  title.innerHTML="<h2>🔎 Geheimes Feld</h2><p>Nur eines dieser Felder ist richtig.</p>";
  let s=Math.floor(Math.random()*12);
  content.innerHTML="<div class='grid secret-grid'>"+Array.from({length:12},(_,i)=>`<button onclick="secretClick(${i===s})">?</button>`).join("")+"</div>";
 }else{
  title.innerHTML="<h2>🚀 Die letzte Aufgabe</h2><p>Drücke 10-mal auf den Button. Dann gehört die Belohnung dir.</p>";
  content.innerHTML="<div class='center'><div id='clicks'>0 / 10</div><button onclick='countClicks()'>WEITER</button></div>";
 }
}
function hit(b){b.remove();let n=document.querySelectorAll(".target").length;document.getElementById("hits").textContent="Treffer: "+(6-n)+" / 6";if(!n)setTimeout(next,500)}
function memory(b){
 if(b.classList.contains("open")||opened.length===2)return;
 b.classList.add("open");opened.push(b);
 if(opened.length===2){
  if(opened[0].dataset.v===opened[1].dataset.v){matched++;opened=[];if(matched===4)setTimeout(next,600)}
  else setTimeout(()=>{opened.forEach(x=>x.classList.remove("open"));opened=[]},650)
 }
}
function answerWord(ok){if(ok)next()}
function secretClick(ok){if(ok)next()}
function countClicks(){clicks++;document.getElementById("clicks").textContent=clicks+" / 10";if(clicks>=10)setTimeout(next,450)}
function next(){
 if(level<5)showLevel();else{game.classList.add("hidden");finish.classList.remove("hidden");bar.style.width="100%";step.textContent="FERTIG ✓"}
}
function finalStep(){
 finish.classList.add("hidden");
 setTimeout(()=>{
  const s=document.getElementById("scare");s.classList.remove("hidden");page.classList.add("shake");
  const flash=document.getElementById("flash");
  flash.animate([{opacity:0},{opacity:1},{opacity:0},{opacity:.8},{opacity:0}],{duration:420});
  // Short, synthesized scare burst; the supplied track starts immediately afterwards.
  try{
   const C=window.AudioContext||window.webkitAudioContext,ctx=new C();
   const o=ctx.createOscillator(),g=ctx.createGain();
   o.type="sawtooth";o.frequency.setValueAtTime(120,ctx.currentTime);
   o.frequency.exponentialRampToValueAtTime(1250,ctx.currentTime+.28);
   g.gain.setValueAtTime(.001,ctx.currentTime);
   g.gain.exponentialRampToValueAtTime(.28,ctx.currentTime+.025);
   g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.72);
   o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.75);
  }catch(e){}
  setTimeout(()=>{
   s.classList.add("hidden");page.classList.remove("shake");
   const m=document.getElementById("music");m.volume=.8;m.play().catch(()=>{});
   document.querySelector(".panel").innerHTML="<div class='center final'><div style='font-size:80px'>🐱</div><h1>GEMEOWT! 😂</h1><p>Du hast jede einzelne Aufgabe gemacht.<br>Und genau das war der Plan.</p></div>";
  },1100);
 },700);
}
</script>
</body>
</html>
